server {
    listen 80;
    listen [::]:80;
    server_name delta.ventoday.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name delta.ventoday.com;

    ssl_certificate /etc/letsencrypt/live/delta.ventoday.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delta.ventoday.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /live/nse_symbols_rsi_volume.csv {
        alias /var/lib/opendelta/data/nse_symbols_rsi_volume.csv;
        default_type text/csv;
        etag on;
        add_header Cache-Control "private, no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
