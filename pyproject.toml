[project]
name = "rsi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2.3,<3",
    "pandas>=3.0.5",
    "pyarrow>=21,<22",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn>=0.35,<1",
    "websockets>=15,<16",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["opendelta*", "backend*"]

[tool.setuptools.package-data]
"opendelta.sql" = ["*.sql"]
