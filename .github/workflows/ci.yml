name: OpenDelta CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e . pytest httpx2
      - name: Python tests
        run: PYTHONPATH=. pytest -q --junitxml=test-results/python.xml
      - name: Migration validation
        run: PYTHONPATH=. pytest -q tests/test_quant_platform.py -k job_idempotency_retry_and_migration
      - name: Research fail-closed smoke
        run: PYTHONPATH=. pytest -q tests/test_quant_platform.py -k research_execution_fails_closed
      - name: Deterministic Research V2 smoke
        run: PYTHONPATH=. pytest -q tests/test_research_v2.py -k deterministic_research_smoke
      - name: Credential and artifact scan
        run: python scripts/security_scan.py
      - name: Deployment script syntax
        run: find web/deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Upload backend test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Generate tracked-market data
        working-directory: web
        run: npm run data:sync
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit
      - name: Production dependency audit
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Rendered integration tests
        working-directory: web
        run: node --test tests/*.test.mjs
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        run: npm run test:browser
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
